name: cambio-diario
on:
  schedule:
    - cron: "17 11 * * 1-5"   # 08:17 em São Paulo (UTC-3), dias úteis
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  cambio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar leitura com respostas salvas
        run: python scripts/cambio.py --fixture tests
      - name: Buscar câmbio do dia
        run: python scripts/cambio.py
      - name: Gravar no repositório
        run: |
          git config user.name "cambio-bot"
          git config user.email "cambio-bot@users.noreply.github.com"
          git add dados/
          git diff --cached --quiet || git commit -m "câmbio $(date -u +%F)"
          git push
